{% extends "base.html" %}

{% block title %}
Profile - TechShare
{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css')}}">
{% endblock %}

{% block content %}
{% if myposts %}
    {% for post in myposts %}
        <div class="post">
            <p>{{ post.content }}</p>
            <p>{{ post.created_at }}</p>
        </div>
    {% endfor %}
{% else %}
    <p>まだ投稿がありません</p>
{% endif %}
{% endblock %}
