{% extends "base.html" %}

{% block title %}
Profile - TechShare
{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/follower.css')}}">
{% endblock %}

{% block content %}
<div class="follower">
    <div class="content">

        <div class="follow-btn">
            <button class="btn-style" onclick="document.getElementById('following').style.display = 'flex'; document.getElementById('followers').style.display = 'none';">
                フォロー
            </button>

            <button  class="btn-style" onclick="document.getElementById('followers').style.display = 'flex'; document.getElementById('following').style.display = 'none';">
                フォロワー
            </button>
        </div>

        <div class="follow-list">
            <div id="following" style="display: none;">
                <p class="card-title">フォロー中</p>
                <div class="user-card">
                    <span class="user">
                        <i class="far fa-user-circle"></i>
                        <span class="user-name">{{ following_users }}</span>
                    </span>
                </div>
            </div>

            <div id="followers" style="display: none;">
                <p class="card-title">フォロワー</p>
                <div class="user-card">
                    <span class="user">
                        <i class="far fa-user-circle"></i>
                        <span class="user-name">{{ followers_of_user }}</span>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
